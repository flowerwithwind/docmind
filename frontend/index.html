<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231F6FEB'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial'>D</text></svg>" />
    <title>DocMind · 多模态文档智能助手</title>
    <script>
      // 首屏主题（避免闪烁）：localStorage → 系统偏好
      try {
        var m = localStorage.getItem('docmind-theme') || 'auto'
        var dark = m === 'dark' || (m === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
