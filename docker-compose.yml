# DocMind 一键部署：docker compose up -d --build  →  http://localhost:8080
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DOCMIND_DATA_DIR: /data
      DOCMIND_API_KEY: ${DOCMIND_API_KEY:-}
      DOCMIND_BASE_URL: ${DOCMIND_BASE_URL:-https://api.deepseek.com/v1}
      DOCMIND_MODEL: ${DOCMIND_MODEL:-deepseek-chat}
      DOCMIND_EMBEDDING_API_KEY: ${DOCMIND_EMBEDDING_API_KEY:-}
      DOCMIND_EMBEDDING_BASE_URL: ${DOCMIND_EMBEDDING_BASE_URL:-}
      DOCMIND_RATE_LIMIT: ${DOCMIND_RATE_LIMIT:-300}
    volumes:
      - docmind-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${DOCMIND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  docmind-data: